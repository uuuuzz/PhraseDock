<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>AI 常用提示词快捷追加器 · AI Prompt Quick Appender</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="renderer.js"></script>
</head>
<body>
  <main id="dock" class="radial-dock">
    <div id="phrases" class="phrases" aria-label="快捷提示词"></div>
    <div id="toast" class="toast" role="status" aria-live="polite" aria-hidden="true"></div>
    <div class="hub-shell">
      <div class="drag-ring" title="拖动 AI 常用提示词快捷追加器" aria-hidden="true"></div>
      <button id="hub" class="hub-button" type="button" aria-label="展开快捷提示词" aria-expanded="false" title="点击展开，拖动外圈移动">
        <span class="hub-symbol" aria-hidden="true"><span class="hub-horizontal"></span><span class="hub-vertical"></span></span>
        <span class="hub-dot" aria-hidden="true"></span>
      </button>
    </div>
  </main>
</body>
</html>
