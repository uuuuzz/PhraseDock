<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Prompt Quick Appender · Product film</title>
  <link rel="stylesheet" href="scene.css">
</head>
<body>
<main id="film">
  <div class="studio-glow"></div>
  <div class="brand"><img src="../../../resources/icons/source/PhraseDock-windows.png"><span>AI 常用提示词快捷追加器</span></div>
  <div class="platform-note">macOS <span>+</span> Windows</div>

  <section id="hero" class="scene">
    <div class="hero-copy">
      <div class="eyebrow">把常用的，留在手边。</div>
      <h1><span>常用提示词。</span><br>一点，追加。</h1>
      <p>少一点重复输入，多一点专注。</p>
    </div>
    <div class="hero-floor"></div>
    <div class="hero-icon-wrap"><img class="hero-icon" src="../../../resources/icons/source/PhraseDock-windows.png"></div>
    <div class="hero-english">AI PROMPT QUICK APPENDER</div>
  </section>

  <section id="demo" class="scene">
    <div class="demo-copy"><div id="step" class="eyebrow"></div><h2 id="demo-title"></h2><p id="demo-subtitle"></p></div>
    <div id="composer-wrap">
      <div class="composer-label"><span class="codex-mark">&gt;_</span> Codex <span class="composer-hint">你的输入框</span></div>
      <div id="composer">
        <div class="text-area"><span id="base-text"></span><span id="first-text" class="insert"></span><span id="second-text" class="insert"></span><span id="extra-text"></span><i id="caret"></i><span id="placeholder">写下你想做的事…</span></div>
        <div class="composer-controls"><span class="attach">+</span><span class="context">继续你的想法</span><span class="send"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></span></div>
      </div>
      <div id="input-note"><i></i><span>光标留在输入框，接着写就好。</span></div>
    </div>
    <div id="dock-wrap">
      <div id="dock"><div id="phrases"></div><div class="hub-shell"><div class="drag-ring"></div><div id="hub-button"><span class="hub-symbol"><i class="hub-horizontal"></i><i id="hub-vertical"></i></span><span class="hub-dot"></span></div></div></div>
      <div id="dock-caption">你的常用提示词，随时就位。</div>
    </div>
    <div id="demo-label">交互演示动画</div>
  </section>

  <section id="outro" class="scene">
    <div class="outro-icon-wrap"><div class="outro-floor"></div><img class="outro-icon" src="../../../resources/icons/source/PhraseDock-windows.png"></div>
    <div class="outro-copy"><div class="eyebrow">常用提示词，随手追加。</div><h2>AI 常用提示词<br>快捷追加器</h2><p>AI Prompt Quick Appender</p><div class="platform-pills"><span>macOS</span><span>Windows</span></div></div>
    <div class="download"><div>免费下载 <span>·</span> 开源项目</div><strong>github.com/uuuuzz/PhraseDock</strong></div>
  </section>
  <div id="cursor"><svg viewBox="0 0 32 40"><path d="M3 2L4 31L11.4 24.5L17.8 37L23.8 33.8L17.6 21.8L27.5 21.3Z" fill="#252823" stroke="white" stroke-width="2.5" stroke-linejoin="round"/></svg></div>
  <div id="click-ring"></div>
</main>
<script src="data.js"></script>
<script src="scene.js"></script>
</body>
</html>
