<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一点，追加。 — AI Prompt Quick Appender</title><link rel="stylesheet" href="film.css"></head>
<body>
<main id="film">
  <div id="light-field"></div>
  <div id="opening-lines"><div class="echo-line"></div><div class="echo-line"></div><div class="echo-line"></div></div>
  <div id="orbit-ring"></div>
  <div id="ink-plus"><i class="bar-x"></i><i class="bar-y"></i></div>
  <div id="composer-pose"><div id="composer-unit">
    <div class="app-label"><span class="terminal-symbol">&gt;_</span><span>Codex</span></div>
    <div id="composer-card"><div class="edge-light"></div>
      <div id="prompt"><span id="base-text"></span><span id="insert-one" class="insert"></span><span id="insert-two" class="insert"></span><span id="more-text"></span><i id="caret"></i><span id="placeholder">写下你的想法…</span></div>
      <div class="input-bottom"><span class="attach">+</span><span id="send"><svg viewBox="0 0 24 24"><path d="M12 18V6M6 12l6-6 6 6"/></svg></span></div>
    </div>
  </div></div>
  <div id="dock-pose"><div id="dock"><div id="phrases"></div>
    <div id="hub-shadow"></div>
    <div class="hub-shell"><div id="drag-ring"></div><div id="hub-button"><span class="hub-symbol"><i class="hub-horizontal"></i><i id="hub-vertical"></i></span><span id="hub-dot"></span></div></div>
  </div></div>
  <div id="cursor"><svg class="arrow" viewBox="0 0 32 40"><path d="M3 2L4 31L11.4 24.5L17.8 37L23.8 33.8L17.6 21.8L27.5 21.3Z" fill="#282a26" stroke="white" stroke-width="2.5" stroke-linejoin="round"/></svg></div>
  <div id="click-pulse"></div>
  <div id="outro-icon"><div class="icon-floor"></div><img src="../../../resources/icons/source/PhraseDock-windows.png"></div>
  <div id="outro-copy"><h1>一点，追加。</h1><p class="product-name">AI 常用提示词快捷追加器</p><div class="platforms">macOS <span>·</span> Windows</div><div class="project-url">github.com/uuuuzz/PhraseDock</div></div>
  <div id="disclosure">交互演示动画</div>
</main>
<script src="data.js"></script><script src="film.js"></script>
</body></html>
